<app-card [shadow]="true">
  <!-- Tabs Navigation in card-header -->
  <div card-header class="flex border-b border-slate-200 bg-slate-50/80">
    <button
      type="button"
      class="flex-1 py-3 px-4 text-xs font-semibold flex items-center justify-center gap-2 border-b-2 transition-all duration-150"
      [ngClass]="activeTab() === 'text' ? 'border-sky-600 text-sky-600 bg-white font-bold' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100'"
      (click)="activeTab.set('text')"
    >
      <span>📝</span> Paste Job Content
    </button>
    <button
      type="button"
      class="flex-1 py-3 px-4 text-xs font-semibold flex items-center justify-center gap-2 border-b-2 transition-all duration-150"
      [ngClass]="activeTab() === 'linkedin' ? 'border-sky-600 text-sky-600 bg-white font-bold' : 'border-transparent text-slate-500 hover:text-slate-800 hover:bg-slate-100'"
      (click)="activeTab.set('linkedin')"
    >
      <span>🔗</span> LinkedIn Job URL
    </button>
  </div>

  <!-- Card Body -->
  <div class="p-5 space-y-4">
    <!-- LinkedIn URL Input Section -->
    @if (activeTab() === 'linkedin') {
      <div class="space-y-1.5 animate-fadeIn">
        <label for="linkedinUrl" class="block text-xs font-semibold text-slate-700">
          LinkedIn Job Posting URL
        </label>
        <div class="flex gap-2">
          <input
            id="linkedinUrl"
            type="url"
            class="flex-1 px-3 py-2 text-xs text-slate-900 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all placeholder:text-slate-400"
            placeholder="https://www.linkedin.com/jobs/view/..."
            [(ngModel)]="linkedinUrl"
            [disabled]="isExtracting() || isStreaming()"
          />
          <button
            type="button"
            class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed border border-slate-200"
            (click)="onExtractLinkedIn()"
            [disabled]="!linkedinUrl || isExtracting() || isStreaming()"
          >
            @if (isExtracting()) {
              <span class="w-3.5 h-3.5 border-2 border-slate-400 border-t-slate-700 rounded-full animate-spin"></span>
              <span>Extracting...</span>
            } @else {
              <span>⚡ Extract</span>
            }
          </button>
        </div>

        @if (extractMessage()) {
          <div
            class="p-2.5 rounded-lg text-xs font-medium border animate-fadeIn"
            [ngClass]="extractIsError() ? 'bg-red-50 text-red-700 border-red-200' : 'bg-sky-50 text-sky-700 border-sky-200'"
          >
            {{ extractMessage() }}
          </div>
        }
      </div>
    }

    <!-- Raw Job Description Textarea Section -->
    <div class="space-y-1.5" [class.hidden]="activeTab() !== 'text' && !jobDescription">
      <div class="flex items-center justify-between">
        <label for="jobDesc" class="text-xs font-semibold text-slate-700 flex items-center gap-1.5 flex-wrap">
          <span>Job Description / Core Requirements</span>
          @if (jobDescription) {
            <span class="text-[11px] font-mono text-slate-500">({{ jobDescription.length }} characters)</span>
          }
          <span class="text-[10px] font-medium text-emerald-600 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded">
            Full-length JDs supported (up to 15,000+ chars)
          </span>
        </label>
        <button
          type="button"
          class="text-xs font-medium text-sky-600 hover:text-sky-700 hover:underline transition-all"
          (click)="loadSampleJob()"
          [disabled]="isStreaming()"
        >
          📋 Load Sample Architect JD
        </button>
      </div>

      <textarea
        id="jobDesc"
        rows="5"
        class="w-full p-3 text-xs text-slate-800 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all font-sans leading-relaxed resize-y placeholder:text-slate-400"
        placeholder="Paste target job description, required technical competencies, responsibilities, or qualification bullet points..."
        [(ngModel)]="jobDescription"
        [disabled]="isStreaming()"
      ></textarea>
    </div>

    <!-- Target Title Override -->
    <div class="space-y-1.5">
      <label for="targetTitle" class="block text-xs font-semibold text-slate-700">
        Target Role Title <span class="text-slate-400 font-normal">(Optional override)</span>
      </label>
      <input
        id="targetTitle"
        type="text"
        class="w-full px-3 py-2 text-xs text-slate-900 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all placeholder:text-slate-400"
        placeholder="e.g. Senior Frontend Architect / Staff UI Engineer"
        [(ngModel)]="targetTitle"
        [disabled]="isStreaming()"
      />
    </div>

    <!-- Primary Action Button -->
    <button
      type="button"
      class="w-full py-3 px-4 rounded-xl text-xs sm:text-sm font-bold text-white shadow-md shadow-sky-600/25 bg-gradient-to-r from-sky-600 to-sky-700 hover:from-sky-500 hover:to-sky-600 active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed disabled:shadow-none"
      (click)="onGenerate()"
      [disabled]="!canGenerate() || isStreaming()"
    >
      @if (isStreaming()) {
        <span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
        <span>Streaming Real-Time AI Decisions...</span>
      } @else {
        <span>✨ Generate Tailored ATS Resume</span>
      }
    </button>
  </div>
</app-card>
