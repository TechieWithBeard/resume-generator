@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in" (click)="onBackdropClick()">
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200 animate-scale-in"
      [ngClass]="maxWidth"
      (click)="$event.stopPropagation()"
    >
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 bg-slate-50 border-b border-slate-200">
        <div class="flex items-center gap-3">
          <ng-content select="[modal-header-icon]"></ng-content>
          <h3 class="text-base font-bold text-slate-900 m-0">{{ title }}</h3>
        </div>
        <button
          type="button"
          class="text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 p-1.5 rounded-lg transition-colors"
          (click)="close.emit()"
          aria-label="Close"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto flex-1 text-slate-700">
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-between px-6 py-3.5 bg-slate-50 border-t border-slate-200">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
