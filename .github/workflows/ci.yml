name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests and Evals Suite
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

  frontend-and-e2e:
    name: Frontend Build & Playwright E2E Suite
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (for backend server during E2E tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Angular Unit Tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build Angular Production Application
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium with OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and Component Suites
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          PORT: 8000

      - name: Upload Playwright Test Report (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
